<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeekZone | Login Administrativo</title>
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/login.js"></script>
</head>
<body class="pagina-login">
  <main class="login-card">
    <h1>⚡ GeekZone</h1>
    <h2>Área Administrativa</h2>
    <form id="form-login">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required minlength="6">

      <button type="submit" id="btn-login">Entrar</button>
    </form>
    <p id="mensagem-login" class="mensagem-status" aria-live="polite"></p>
    <a class="voltar-loja" href="index.html">← Voltar para a loja</a>
  </main>
</body>
</html>
