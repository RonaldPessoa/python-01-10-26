<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeekZone | Administração de Produtos</title>
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/admin.js"></script>
</head>
<body class="admin-bloqueado">
  <header class="topo-admin">
    <div>
      <h1>⚡ GeekZone</h1>
      <p>Administração de Produtos</p>
    </div>
    <div class="acoes-topo">
      <a href="index.html">Ver loja</a>
      <button id="btn-sair" type="button">Sair</button>
    </div>
  </header>

  <main class="container-admin">
    <section class="painel-formulario">
      <h2 id="titulo-formulario">Cadastrar produto</h2>
      <form id="form-produto">
        <input type="hidden" id="produto-id">

        <label for="nome-produto">Nome do produto</label>
        <input type="text" id="nome-produto" required maxlength="100">

        <label for="preco-produto">Preço (R$)</label>
        <input type="number" id="preco-produto" required min="0" step="0.01">

        <label for="estoque-produto">Quantidade em estoque</label>
        <input type="number" id="estoque-produto" required min="0" step="1">

        <label for="imagem-produto">URL da imagem</label>
        <input type="url" id="imagem-produto" placeholder="https://exemplo.com/produto.jpg">
        <img id="preview-imagem" class="preview-imagem" alt="Pré-visualização da imagem" hidden>

        <div class="acoes-formulario">
          <button type="submit" id="btn-salvar">Cadastrar</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar edição</button>
        </div>
      </form>
      <p id="mensagem-status" class="mensagem-status" aria-live="polite"></p>
    </section>

    <section class="painel-lista">
      <h2>Produtos cadastrados</h2>
      <div class="tabela-responsiva">
        <table>
          <thead>
            <tr>
              <th>Imagem</th>
              <th>Produto</th>
              <th>Preço</th>
              <th>Estoque</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-produtos">
            <tr><td colspan="5">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
